# chopstr · Redaktionelle Grundlage für die Clip-Auswahl · Fassung 2
#
# FASSUNG 2 (AP0b, Stand 03.10.2026). Inhaltlich eine Kopie von Fassung 1: jede Regel, jeder Wert und
# jeder Prompt-Text ist gleich. Neu sind drei Abschnitte am Ende:
#   prompts         welche Prompt-Version gilt (gleiche Pins wie Fassung 1)
#   implementation  Schalter der folgenden Arbeitspakete, alle false
#   origins         Herkunft jeder Regel nach docs/RESEARCH-CLIPPING-KERN.md
# und eine korrigierte Begründung bei offene_frage (Zeigarnik ist widerlegt). Aktiv wird Fassung 2
# erst mit CHOPSTR_POLICY_VERSION=2; Fassung 1 bleibt unverändert und ladbar (Rollback).
#
# Übernommene Schlüssel behalten ihren deutschen Namen, weil editorial.Policy sie so liest; neue
# Schlüssel sind englisch.
#
# Diese Datei ist die EINZIGE Quelle für die Frage, was einen guten Clip ausmacht. Sie wird von
# beiden Bewertungswegen gelesen: von der Heuristik (chopstr_worker/heuristic_llm.py), die heute
# läuft, und vom Sprachmodell (packages/prompts/score_clip_v1.md), das später kommt. Wer eine Regel
# ändern will, ändert sie hier und nirgends sonst.
#
# Jeder Kandidat schreibt mit, nach welcher Fassung er entstanden ist (candidates.policy_version).
# Nur so lassen sich zwei Läufe vergleichen, wenn hier etwas geändert wurde.
#
# HERKUNFT DER REGELN, damit später nachvollziehbar ist, warum etwas so dasteht:
#   [M]  Masterclass „Die Psychologie hinter Content & Clips", Modul 10, Ferdi, Sep 2026
#   [E]  Eigene Messung an 105 guten und 12 schlechten Beispielclips der Redaktion
#   [R]  Recherche: NPR Training, Ira Glass, Rhapsody-Paper (arXiv 2505.19429), Socialinsider
#
# Wo [M] und [R] sich widersprechen, gilt [M]. Begründung steht jeweils dabei.
#
# Diese Kürzel sagen, woher eine Regel stammt, nicht wie gut sie belegt ist. Den Belegstatus trägt
# ab Fassung 2 der Abschnitt origins (F Forschungsbefund, H Übertragungshypothese, R Produktregel,
# G gelernte Entscheidung). Wichtig: Die Recherche hat die Angabe „105 gute Beispielclips“ nicht
# bestätigt; der eingefrorene Referenzsatz enthält vier gute und zwölf schlechte Clips. Alles, was
# sich auf [E] stützt, ist deshalb H.

version: 2
stand: "2026-10-03"

# ------------------------------------------------------------------------------------------------
# Länge
# ------------------------------------------------------------------------------------------------
# Herkunft ab Fassung 2: H (siehe origins). Die folgende [E]-Angabe ist laut Recherche nicht belastbar.
# [E] 105 gute Beispielclips: Median 41,3 s, 61 % zwischen 30 und 45 s, Spanne 20,7 bis 64,8 s.
#     Die 12 schlechten liegen im Median bei 57,5 s, mit Ausreißern bei 124 und 277 s.
#     Das Fenster hält über zwei verschiedene Themenwelten und zwei verschiedene Sprecher.
# [M] Skript-Template: Auflösung bei 40 bis 50 s, CTA bis 60 s.
# [R] Socialinsider (6 Mio. Reels): 45 bis 60 s höchste Interaktionsrate. Vorsicht, das ist über
#     alle Inhaltsarten gemittelt und nicht podcastspezifisch.
#
# ACHTUNG: Unsere Pipeline lag beim ersten Messlauf bei 19,3 s im Median. Das ist der grösste
# gemessene Einzelunterschied zur Referenz.
laenge:
  ziel_s: 41
  gut_von_s: 30
  gut_bis_s: 55
  # Ausserhalb dieser Grenzen wird ein Moment nicht mehr angeboten. Das war lange anders: die
  # Grenzen hiessen „hart", wirkten aber nur als Abzug, und im Code standen mit 12 und 90 Sekunden
  # ganz andere Zahlen. An BP CW ist so ein Clip von 78 Sekunden entstanden, mit dem hoechsten
  # Laengenabzug von 1,0 und trotzdem ausgeliefert. Jetzt gilt eine Zahl, und sie gilt wirklich.
  hart_min_s: 18
  hart_max_s: 70

  # KONTEXTZUGABE. Die Laenge entscheidet, aber nicht gegen den Sinn. Endet ein Clip vor dem „aber",
  # das ihn erst erklaert, mitten im Satz oder auf einem offenen Konnektor, darf er so weit nach
  # hinten wachsen, bis dieser Mangel weg ist.
  #
  # Die Zugabe ist keine allgemeine Verlaengerung. Sie wird nur gegen einen benannten Mangel
  # eingesetzt (siehe ``ausstieg``), sie hoert auf, sobald er behoben ist, und sie steht nicht zur
  # Verfuegung, um einen Clip „noch etwas voller" zu machen. Ein Clip, den sie nicht heilt, wird
  # verworfen statt verlaengert.
  #
  # Es sind zwei verschiedene Groessen, und sie duerfen nicht verwechselt werden:
  #
  #   kontext_zugabe_s     wie weit ein Clip UEBER hart_max_s hinausgehen darf
  #   kontext_zugabe_saetze wie viele Saetze die Heilung anhaengen darf
  #
  # BEIDE Grenzen muessen gelten. Die Sekunden sind die Ansage. Die Satzzahl kommt dazu, damit
  # nicht viele kurze Saetze zusammen doch eine halbe Minute ergeben.
  #
  # GEMESSENE FOLGE, bitte vor dem Verschieben lesen: an BP CW sind die Saetze im Median 4,1 s
  # lang, aber 27 Prozent sind laenger als 7 s (90. Perzentil 15,1 s). Ein kaputtes Ende laesst
  # sich nur heilen, indem der naechste Satz dazukommt; passt der nicht in die sieben Sekunden,
  # bleibt der Mangel, und der Clip wird verworfen.
  #
  # Konkret an BP CW: zwei Clips enden kaputt („endet direkt vor aber", „endet mitten im Satz auf
  # …"). Der naechste Satz liegt 8,9 beziehungsweise 19,2 Sekunden entfernt. Mit sieben Sekunden
  # werden beide verworfen; aus sechs Vorschlaegen werden drei Clips. Wuerde die Zugabe auf 20 s
  # stehen, waeren es fuenf, alle mit heilem Ende und alle im guten Laengenfenster (33,9 und
  # 49,2 s). Das ist eine Abwaegung zwischen weniger Clips und laengeren Clips, keine technische
  # Frage, deshalb steht sie hier und nicht im Code.
  kontext_zugabe_s: 7
  kontext_zugabe_saetze: 2

  # ANFANG HEILEN (AP2, neu in Fassung 2). Spiegel der Kontextzugabe am Ende: ein Clip, der mitten im
  # Satz, mit einem Pronomen ohne Bezug oder in einer offenen Verbklammer beginnt, darf um höchstens
  # so viele Sätze und Sekunden nach vorn wachsen, bis der Mangel weg ist. Beide Grenzen gelten.
  # Gelesen nur mit implementation.sentence_rule (story_engine.heal_start).
  context_front_sentences: 2
  context_front_s: 7

# ------------------------------------------------------------------------------------------------
# Rubrik
# ------------------------------------------------------------------------------------------------
# [M] Modul 10.2, sieben Kriterien mit je 0 bis 2 Punkten, 14 Punkte möglich.
#
# Unsere bisherige Rubrik hatte fünf Kriterien (hook, payoff, specificity, tension, audience_fit)
# auf einer Skala von 0 bis 10. Zwei kamen dazu: standalone war vorher nur eine Ja/Nein-Sperre,
# emotion fehlte ganz. „offene_frage" ersetzt das alte „tension" und ist schärfer gefasst.
rubrik:
  skala_max: 2
  kriterien:
    - schluessel: standalone
      frage: "Versteht man es ohne Vorwissen?"
      null_punkte: "Braucht Kontext, der im Clip nicht vorkommt"
      zwei_punkte: "Sofort klar, auch für jemanden, der die Folge nicht kennt"
      gewicht: 0.20
      herkunft: "[M] 10.2; [R] Vorlese-Test: ersten Satz ohne Kontext laut lesen"
    - schluessel: hook
      frage: "Gibt es einen Satz, der in drei Sekunden stoppt?"
      null_punkte: "Kein Satz, der für sich allein anhält"
      zwei_punkte: "Der erste Satz stoppt, im Originalton, ohne Overlay"
      gewicht: 0.20
      herkunft: "[M] 10.2 und Modul 3"
    - schluessel: offene_frage
      frage: "Entsteht eine Neugierlücke?"
      null_punkte: "Alles gesagt, nichts offen"
      zwei_punkte: "Die Frage löst sich erst am Ende"
      gewicht: 0.15
      # Fassung 1 begründete das mit dem Zeigarnik-Effekt. Der ist widerlegt (Meta-Analyse Ghibellini
      # und Meier 2025: kein Gedächtnisvorteil). Tragfähig ist die Informationslücke mittlerer Größe
      # und der Drang, eine offene Schleife zu schließen (Ovsiankina); beides auf Clips übertragen, H.
      herkunft: "[M] 10.2; Informationslücke (Golman und Loewenstein 2018) und Ovsiankina-Effekt, Übertrag auf Clips H"
    - schluessel: spezifitaet
      frage: "Gibt es Zahlen, Namen, Bilder?"
      null_punkte: "Abstrakt, austauschbar"
      zwei_punkte: "Konkret, nachprüfbar"
      gewicht: 0.15
      herkunft: "[M] 10.1 und 10.2"
      hinweis: >
        [R] NPR rät bei Radio-Originaltönen ausdrücklich von Zahlen ab, sie erzeugten keine
        Emotion. Wir folgen trotzdem [M], weil unsere Clips Untertitel einbrennen: eine
        eingeblendete Zahl trägt, eine nur gesprochene verpufft. Fällt das Einbrennen weg, ist
        dieses Gewicht neu zu prüfen.
    - schluessel: emotion
      frage: "Trägt der Moment eine klare Emotion?"
      null_punkte: "Neutral, sachlich, unbeteiligt"
      zwei_punkte: "Stark und eindeutig"
      gewicht: 0.15
      herkunft: "[M] 10.2; [R] NPR: starke Originaltöne sind emotional, nicht faktisch"
    - schluessel: aufloesung
      frage: "Endet es auf einem Hochpunkt?"
      null_punkte: "Verpufft, bricht ab, läuft aus"
      zwei_punkte: "Pointe, Merksatz oder Schlussfolgerung"
      gewicht: 0.10
      herkunft: "[M] 10.2 und Auswahlfehler 2; [R] Button-Konzept aus Comedy und Radio"
    - schluessel: zielgruppe
      frage: "Trifft es die Bewusstseinsstufe des Zuschauers?"
      null_punkte: "Falsche Stufe, etwa ein Angebot an ein kaltes Publikum"
      zwei_punkte: "Passt genau"
      gewicht: 0.05
      herkunft: "[M] 10.2 und Modul 2 (Schwartz)"

# [M] Faustregel: ab 10 von 14 schneiden, unter 7 verwerfen, dazwischen umbauen.
# Entscheidung Ferdi, 24.09.2026: NICHT sperren, nur sortieren. Die Schwellen bleiben als Anzeige
# erhalten, damit man sieht, wo ein Clip steht, aber kein Moment wird unterdrückt. Begründung:
# solange die Heuristik bewertet und nicht ein Sprachmodell, ist eine harte Sperre zu riskant.
bewertung:
  modus: sortieren   # sortieren | sperren
  schwelle_schneiden: 10
  schwelle_verwerfen: 7
  punkte_gesamt: 14
  # Neu in Fassung 2 (AP4): Modus sperren, aber nur mit Sprachmodell. Mit dem Heuristik-Provider bleibt
  # es bei sortieren, weil seine Werte unkalibriert sind (RK 2 Befund 11). bewertung.modus gilt für
  # Fassung 1 unverändert. Gelesen von editorial.block_mode_settings, verdrahtet mit story_engine.
  modus_v2: sperren
  only_with_language_model: true
  begruendung: "Aufmerksamkeit darf eine falsche Aussage nicht ausgleichen. Erst die harten Prüfungen, dann die Bewertung; unter der Schwelle verwerfen wird nur mit Sprachmodell."
  # Neu in Fassung 2 (AP9): Die Länge wirkt nur als Abzug (laenge_abzug mit der gemessenen Abspieldauer in
  # story_engine.policy_total), nicht zusätzlich als Bonus in aufloesung und zielgruppe der Heuristik, die
  # sie dort aus der Wortzahl schätzt. Gelesen von editorial.length_only_as_penalty. Rollback: false.
  length_only_as_penalty: true

# ------------------------------------------------------------------------------------------------
# Moment-Typen
# ------------------------------------------------------------------------------------------------
# [M] Modul 10.1. Die Erkennungszeichen stammen wörtlich aus dem Masterfile und sind hier als
# Suchmuster ausformuliert. Ein Moment, der auf keinen Typ passt, ist damit nicht schlecht, aber
# er hat keinen erkennbaren Hebel.
#
# GEMESSENE GRENZE, bitte vor dem Aufblähen der Listen lesen:
# Über drei echte Transkripte (Wagenknecht, Linke, BP, zusammen 1891 Sätze) greifen diese Marker
# auf nur 2,4 bis 6,2 Prozent der Sätze. „contrarian" löst in einem einstündigen Streitgespräch
# ein bis drei Mal aus, in einem Format, das aus Widerspruch besteht.
#
# Der Grund ist nicht eine zu kurze Liste, sondern die Sache selbst: Echte Rede sagt nicht „das
# ist falsch", sie sagt „ja aber wenn man sich das anschaut, dann sieht man doch". Einen
# Widerspruch zu erkennen verlangt Verstehen, nicht Zeichenkettenvergleich. Längere Listen
# erzeugen vor allem Fehlalarme.
#
# Die Marker bleiben deshalb eng. Sie sind ein Bonus, wenn sie greifen, und kein Auswahlkriterium.
# Die eigentliche Erkennung ist Aufgabe des Sprachmodells, sobald es angeschlossen ist.
moment_typen:
  - schluessel: contrarian
    name: "Widerspruch zur Erwartung"
    hebel: "Kontrast, Erwartungsbruch"
    marker:
      - "das ist falsch"
      - "alle sagen"
      - "die meisten glauben"
      - "das gegenteil"
      - "in wahrheit"
      - "stimmt nicht"
      - "irrtum"
    bonus: 2.0
  - schluessel: zahl
    name: "Konkrete Zahl oder Ergebnis"
    hebel: "Spezifität, Beweis"
    marker_regex: '\b\d+([.,]\d+)?\s*(prozent|%|euro|eur|jahre|monate|wochen|tage|stunden|kilo|mal)\b'
    bonus: 1.5
  - schluessel: ministory
    name: "Kleine Geschichte mit Wendepunkt"
    hebel: "Spannungsbogen, Zeigarnik"
    marker:
      - "und dann"
      - "plötzlich"
      - "ich dachte"
      - "auf einmal"
      - "bis ich"
      - "in dem moment"
    bonus: 2.0
  - schluessel: gestaendnis
    name: "Geständnis oder Fehler"
    hebel: "Verletzlichkeit, Sympathie"
    marker:
      - "mein größter fehler"
      - "ich hab mich geirrt"
      - "ich habe mich geirrt"
      - "das war ein fehler"
      - "ich lag falsch"
      - "jahrelang falsch"
    bonus: 2.0
  - schluessel: konflikt
    name: "Konflikt oder Debatte"
    hebel: "Emotion, Parteinahme"
    marker:
      - "da widerspreche ich"
      - "das sehe ich anders"
      - "nein, das"
      - "quatsch"
    # [M] nennt als Erkennungszeichen ausdrücklich die „lauter werdende Stimme". Siehe audio.
    braucht_audio: true
    bonus: 2.0
  - schluessel: merksatz
    name: "Klarer Merksatz oder Bauplan"
    hebel: "Nutzen, Speicherwert"
    marker:
      - "die regel ist"
      - "drei schritte"
      - "zwei dinge"
      - "merk dir"
      - "das prinzip"
      - "faustregel"
    bonus: 1.5

# ------------------------------------------------------------------------------------------------
# Einstieg
# ------------------------------------------------------------------------------------------------
einstieg:
  # [E] Im Material gefunden: ein schlechter Clip beginnt mit „auf den Ausschnitt von Friedrich
  # Merz reagiert" und schneidet damit mitten in eine Selbstkorrektur. Zwölf Wörter davor stand
  # „Krankschreibungen werden in Deutschland massiv missbraucht", ein vollständiger Aufschlag.
  nie_mitten_im_satz: true
  nie_in_selbstkorrektur: true

  # [E] „Er ist ja offensichtlich kein unintelligenter Mann" und „Sie haben 30.000 investiert":
  # beide setzen voraus, dass der Zuschauer weiss, wer gemeint ist.
  # „es" ist ausgenommen, es ist meist Platzhalter ohne Bezug.
  keine_pronomen_ohne_bezug: true
  pronomen: [er, sie, ihn, ihm, ihr, ihnen, dessen, deren]

  # [R] Mehrfach belegt: die Frage des Gastgebers ist Anlauf, nicht Inhalt.
  # [E] ABER: 45,7 % der guten Clips beginnen mit einer Frage. Der Unterschied ist, WER fragt.
  # Die rhetorische Frage des Sprechers ist ein Hook ([M] Hook-Bank, Typ „Frage").
  # Deshalb: nur die Frage eines ANDEREN Sprechers am Anfang ist ein Fehler.
  keine_gastgeberfrage: true

  # [M] 10.3 „Einleitungen radikal kappen": „Also, ich würde sagen, dass…" fliegt raus.
  einleitungen_kappen: true
  einleitungsfloskeln:
    - "also ich würde sagen"
    - "ja also"
    - "ich meine"
    - "wie gesagt"
    - "also gut"
    - "gute frage"
    - "das ist eine gute frage"

# ------------------------------------------------------------------------------------------------
# Ausstieg
# ------------------------------------------------------------------------------------------------
ausstieg:
  # [M] Auswahlfehler 2: „Der Clip hört auf, wo der Sprecher Luft holt, nicht wo die Pointe sitzt."
  # [E] Belegt am schlechten AfD-Clip: er endet bei „ist die Macht, die dadurch entsteht" und das
  # nächste Wort in der Quelle ist „grenzenlos". Die Pointe liegt einen Schritt ausserhalb.
  satz_zu_ende: true
  verbklammer_nicht_trennen: true

  # [R] Button-Konzept: Der Clip endet, wo ein Gedanke geschlossen ist UND danach eine
  # Einschränkung, Relativierung oder ein Themenwechsel folgt. Vor der Abschwächung aufhören.
  # [E] Belegt am guten Clip: der Cutter liess einen starken Satz liegen, weil danach ein neues
  # Thema begann.
  vor_der_abschwaechung: true
  abschwaechung_marker:
    - "gleichzeitig"
    - "auf der anderen seite"
    - "andererseits"
    - "wobei"
    - "allerdings"
    - "aber natürlich"
    - "um fair zu sein"
  # AP2, neu in Fassung 2: die Heilung des Endes endet nie auf einem Satz, der mit einem dieser
  # Marker beginnt; sie sucht einen Satz weiter (innerhalb der Zugabe), sonst wird der Clip mit dem
  # Grund ends_on_qualification verworfen. Gelesen nur mit implementation.sentence_rule.
  never_end_on_qualification: true

# ------------------------------------------------------------------------------------------------
# Zusammenhang
# ------------------------------------------------------------------------------------------------
# [E] Der schlechteste Clip im Material (277 s) spannt sich über die Wörter 805 bis 7935 eines
# Transkripts mit 9593 Wörtern und enthält davon nur 839. Das ist kein Moment, sondern eine
# Collage aus dem halben Gespräch.
# [M] Auswahlfehler 3: „Zu viele Gedanken. Zwei Punkte in 40 Sekunden, keiner bleibt hängen."
zusammenhang:
  ein_zusammenhaengender_abschnitt: true
  # Verhältnis von tatsächlichem Inhalt zur überspannten Strecke. Darunter ist es eine Collage.
  mindest_dichte: 0.6
  max_gedanken: 1

# ------------------------------------------------------------------------------------------------
# Audiosignal
# ------------------------------------------------------------------------------------------------
# [M] 10.5, wörtlich: die Kriterien lassen sich als Signale erkennen, darunter „Stimmlage".
#     10.1 nennt beim Typ Konflikt ausdrücklich die „lauter werdende Stimme".
# [R] Rhapsody-Paper: Modelle mit Sprachsignal UND Transkript schlagen reine Textauswahl deutlich;
#     GPT-4o und Gemini scheitern an der Aufgabe im Zero-Shot.
# [E] Befund im eigenen Code: Wir berechnen RMS-Energie, Spectral Flux, Lachen und Applaus im
#     heatmap-Schritt und benutzen sie nur zur Auswahl der Suchstartpunkte. In der Bewertung
#     (story_score.py) kommt kein Audiomerkmal vor. Das Signal liegt vor und wird weggeworfen.
audio:
  in_bewertung_verwenden: true
  gewicht: 0.15
  merkmale:
    energie_anstieg: true      # lauter werdende Stimme, Marker für Konflikt und Nachdruck
    lachen: true               # externer Hook, bereits erkannt
    applaus: true
    pause_vor_aussage: true    # eine Pause davor betont, was danach kommt

# ------------------------------------------------------------------------------------------------
# Hook vorziehen
# ------------------------------------------------------------------------------------------------
# [M] 10.3: „Die stärkste Aussage, oft aus der Mitte, an den Anfang stellen, dann zurückspringen."
# Entscheidung Ferdi, 24.09.2026: bauen.
#
# Das Datenmodell trägt das bereits: candidates.structure kennt den Wert payoff_first, und
# clips.composition ist als Abfolge von Abschnitten in Abspielreihenfolge definiert.
hook_vorziehen:
  aktiv: true
  # Nur wenn der beste Satz deutlich stärker ist als der erste, sonst bleibt die Reihenfolge.
  mindest_vorsprung: 2.0
  # Der vorgezogene Teil darf nicht länger sein als das, sonst ist es keine Zuspitzung mehr.
  # Muss mit compose.MAX_TEASER_S übereinstimmen: dort wird es beim Zusammensetzen hart geprüft,
  # ein längerer Teaser würde also stillschweigend verworfen. Ein Test hält beide zusammen.
  max_teaser_s: 6.0
  # Nie aus dem letzten Viertel vorziehen, das nimmt die Auflösung vorweg.
  nicht_aus_letztem_anteil: 0.25

# ------------------------------------------------------------------------------------------------
# Was nie ein Clip wird
# ------------------------------------------------------------------------------------------------
# [M] 10.4 Auswahlfehler 1 und 5.
# [R] NPR: schwach ist die Beschreibung eines Vorgangs, stark ist die Ich-Erfahrung mit Wendepunkt.
# [E] Im Material: „Wo liegt das ungefähr? Eine Stunde von Göteborg entfernt." Reine Logistik.
ausschluss:
  organisatorisches_gespraech: true
  organisations_marker:
    - "wo liegt das"
    - "wie lange dauert"
    - "wann treffen wir"
    - "können wir kurz"
    - "test test"
    - "hörst du mich"
  begruessung_und_abschied: true
  insiderwitz_ohne_kontext: true

# ------------------------------------------------------------------------------------------------
# Untertitel-Ereignisse (neu in Fassung 2, AP10a)
# ------------------------------------------------------------------------------------------------
# Neue Untertitelzeiten sind eine Folge des Schnitts, keine Gestaltungsänderung: Farben, Schrift,
# Größe, Position, Wörter je Karte, Animation und Highlight-Stil bleiben gleich. Gelesen wird der
# Abschnitt nur, wenn implementation.captions.word_bridge an ist; dieser Schalter ist der Rollback
# für alle Regeln hier (chopstr_worker/pipeline/captions_de.py). Mit dem Schalter gilt außerdem:
# Zahl plus Einheit ist ein Token, Bindestrichwörter werden nur am vorhandenen Bindestrich getrennt,
# Komposita bevorzugt an Morphemgrenzen (Netflix-Norm, RK 5).
captions:
  # Ein Wort-Ereignis endet erst beim Start des nächsten Wortes, innerhalb einer Karte und von Karte
  # zu Karte; die Caption verschwindet in kurzen Sprechpausen nicht mehr (RK 2 Befund 9, Flackern).
  bridge_words: true
  # Größte Lücke in Sekunden, die überbrückt wird; bei längerer Lücke endet das Ereignis am Wortende.
  bridge_max_s: 0.4
  # Mindeststandzeit in Sekunden je Karte mit mehreren Wörtern; nie in die nächste Karte hinein.
  min_event_s: 0.8
  # Bruch nach einem Komma nur, wenn die Karte sonst die Zeilenbreite der Karte überschreitet (P30).
  comma_break_only_on_overflow: true

# ------------------------------------------------------------------------------------------------
# Schnittkanten (neu in Fassung 2, AP10b)
# ------------------------------------------------------------------------------------------------
# Vor- und Nachlauf an Wortgrenzen statt Schnitt exakt auf den Satzzeiten (RK 2 Befund 8). Gelesen
# über editorial.cut_settings von pipeline.transitions (pad_segments, check_transitions) im Render
# (render_plan.build_plan, render_v2). Wirksam nur zusammen mit implementation.cut.padding; steht eins
# auf false, schneidet der Render wie in Fassung 1 (Rollback, Render-Plan-Hash wie vorher).
cut:
  padding: true
  # Vorlauf in Sekunden vor dem ersten Wort eines Segments, nie vor dem Ende des vorigen Wortes.
  lead_in_s: 0.06
  # Nachlauf in Sekunden nach dem letzten Wort eines Segments, nie in das nächste Wort.
  lead_out_s: 0.18
  # Kleinste Restpause an einer Klebestelle (Nachlauf plus Vorlauf); darunter ein Hinweis (mittel).
  min_gap_s: 0.1
  # Unter dieser Sicherheit liegt die Kante konservativ in der Mitte der Stille und wird markiert.
  # Verweis auf die Schwelle der Transkription (keine eigene Zahl).
  low_confidence_threshold: transcribe.LOW_CONF_THRESHOLD

# ------------------------------------------------------------------------------------------------
# Hook (neu in Fassung 2, AP6a)
# ------------------------------------------------------------------------------------------------
# Der Text-Hook darf verdichten, aber nicht mehr behaupten als der Clip trägt (Master-Prompt 8).
# Gelesen von copy_engine.write_copy (Auswahl v2), copy_de.lint (Hyperbel) und hooks_v2 (Prompt).
# Wirksam nur zusammen mit implementation.hook.native_spoken; steht eins auf false, gilt die Auswahl
# wie in Fassung 1. Rollback: Schalter und Pin hooks gemeinsam zurücksetzen (native_spoken false,
# prompts.hooks 1), sonst geht hooks_v2 mit der Auswahl aus Fassung 1 zusammen.
hook:
  # Gesprochener Hook ist der wörtliche Einstieg des Clips (erster Satz, bei mehr als zwölf Wörtern
  # ein wörtlicher Teil an einer Phrasengrenze), nie generierter Text.
  native_spoken: true
  # Leere Intensivierung ersetzt keine Substanz. Der Linter meldet sie, die Auswahl v2 verwirft eine
  # Variante damit. Kleingeschrieben, Teilstring im kleingeschriebenen Hook.
  hyperbole:
    - "das verändert alles"
    - "niemand spricht darüber"
    - "niemand redet darüber"
    - "das ist das geheimnis"
    - "du glaubst nicht"
  # Teilsatz als Hook. false: der Text-Hook ist immer ein ganzer Originalsatz (der erste, sonst ein
  # späterer kurzer Satz ohne Rückbezug) oder es gibt keinen Overlay-Text; der gesprochene Hook ist der
  # ganze erste Satz. true: zusätzlich geschlossene Teilsätze an Phrasengrenzen (Opt-in, Fehlerrichtung
  # bleibt ganzer Satz statt Bruchstück).
  allow_partial_opening: false
  # Aussage als Standard, Frage höchstens als eine Variante unter mehreren (zu testen).
  # prompt_only: wirkt nur über den Text von hooks_v2, kein Code liest diesen Wert.
  question_as_variant: true

# ------------------------------------------------------------------------------------------------
# Satzzerlegung (neu in Fassung 2, AP2)
# ------------------------------------------------------------------------------------------------
# Eine Satzende-Funktion für Zerlegung, Satzgrenzen-Tor und Messung (dach_nlp.sentence_end_kind).
# v2: Satzzeichen zuerst, Sprecherwechsel ist Grenze, eine Pause ab 0,7 s nur Grenzkandidat
# (angenommen mit großgeschriebenem Folgewort und ohne offene Klammer); Abkürzungsliste ohne „so",
# „i", „mag", „max", „art", „min". v1 ist das Verhalten vor AP2. Wirksam nur mit
# implementation.sentence_rule; eine bestehende Transkriptversion behält ihre sentence_idx.
segmentation:
  sentence_rule: v2
  # Obergrenze unter v2: ab 25 s oder 40 Wörtern gilt die nächste Pause ohne offene Klammer auch vor
  # kleingeschriebenem Wort, sonst bis zur doppelten Grenze die längste Pause. Hat ein Transkript
  # weniger als ein Satzzeichen je 40 Wörter, gilt Regel v1 (ausgewiesen als v1_fallback_no_punct).
  max_sentence_s: 25
  max_sentence_words: 40

# ------------------------------------------------------------------------------------------------
# Verbklammer (neu in Fassung 2, AP3)
# ------------------------------------------------------------------------------------------------
# Geprüft wird der Schnitt zwischen Vorsatz und Folgesatz (Anfang und Ende des Clips), nicht ein Satz
# für sich. Mit spaCy über das Modell, ohne spaCy über eine Heuristik aus drei Signalen
# (dach_nlp.bracket_heuristic). fallback: heuristic oder off; off heißt ohne spaCy nicht prüfen und
# das sichtbar melden. Gelesen wird der Abschnitt nur, wenn ausstieg.verbklammer_nicht_trennen gilt.
verb_bracket:
  fallback: heuristic
  # Verbpartikeln trennbarer Verben („Wir fangen morgen | an.").
  particles: [an, auf, aus, ein, mit, zu, ab, vor, nach, zurück, weg, her, hin, los, fest, vorbei, weiter]
  # Nebensatzkonnektoren, nach denen das finite Verb am Ende steht.
  subordinators: [dass, weil, wenn, ob, obwohl, damit, nachdem, bevor, als, während, falls, sofern, sodass]
  # Finite Formen von haben, sein, werden, können, müssen, wollen, sollen, dürfen, mögen.
  auxiliaries: [
    hab, habe, hast, hat, haben, habt, hatte, hattest, hatten, hattet, hätte, hättest, hätten, hättet,
    bin, bist, ist, sind, seid, war, warst, waren, wart, wäre, wärst, wären, wärt,
    werde, wirst, wird, werden, werdet, wurde, wurdest, wurden, wurdet, würde, würdest, würden, würdet,
    kann, kannst, können, könnt, konnte, konntest, konnten, konntet, könnte, könntest, könnten, könntet,
    muss, musst, müssen, müsst, musste, musstest, mussten, musstet, müsste, müsstest, müssten, müsstet,
    will, willst, wollen, wollt, wollte, wolltest, wollten, wolltet,
    soll, sollst, sollen, sollt, sollte, solltest, sollten, solltet,
    darf, darfst, dürfen, dürft, durfte, durftest, durften, durftet, dürfte, dürftest, dürften, dürftet,
    mag, magst, mögen, mögt, mochte, mochtest, mochten, mochtet, möchte, möchtest, möchten, möchtet,
  ]

# ------------------------------------------------------------------------------------------------
# Kürzen innerhalb des Clips (neu in Fassung 2, AP7)
# ------------------------------------------------------------------------------------------------
# Remove- und Keep-Logik mit Mehrsegment-Komposition (chopstr_worker/pipeline/trim_plan.py). Ballast
# raus, Bedeutung bleibt: Schutzbereiche (Negation, Bedingung, Einschränkung, Vergleichsmaßstab,
# zeitliche Einordnung, Unsicherheit, Definition, Sprecherzuordnung, Korrektur) werden nie angefasst,
# nur die technische Leerstelle wird gekürzt und nie auf null, Modalpartikeln bleiben (P3).
# Semantische Neuverknüpfung (nicht benachbarte Sätze) zählt getrennt von lokalen Schnitten (Pausen,
# Füllwörter innerhalb einer Passage); höchstens zwei Splices, Debatten nie umordnen (E6).
# enabled bleibt false bis zum Blindvergleich (AP11); zusätzlich gilt implementation.trim.enabled.
# Gelesen über editorial.trim_settings; zusammenhang.mindest_dichte gilt für die Komposition.
trim:
  enabled: false
  # Zielpause in Sekunden nach dem Kürzen einer technischen Leerstelle, je zur Hälfte vor und nach
  # der Klebestelle. Nie null.
  pause_target_s: 0.25
  # Eine technische Leerstelle wird nur gekürzt, wenn dabei mindestens so viel Zeit gewonnen wird.
  min_trim_gain_s: 0.15
  # Stille ab dieser Länge ist nie technisch (mögliche Demonstration ohne Sprache, Innehalten).
  long_silence_s: 1.5
  # Kein Segment aus lokalen Schnitten wird kürzer; sonst entfällt der Schnitt (hörbare Sprünge).
  min_segment_s: 0.6
  # Höchstens so viele Verbindungen nicht benachbarter Sätze je Clip (E6, nie lockern).
  max_semantic_splices: 2
  # In einer Debatte (zwei Sprecher mit Wechseln) kein Teaser und keine Umstellung (E6).
  debate_no_reorder: true
  # Pausenklassen technical, orientation, dramatic, reaction, demonstration. Nur technical wird gekürzt.
  pause_classes:
    # Eine Pause vor diesen Stellen ist dramaturgisch: Zahl, Negation, Kontrastwort, Pointe.
    dramatic_before: [number, negation, contrast, punchline]
    # Eine Pause nach diesen Stellen ist eine Reaktionspause: Frage, Lachen, Reaktionswort.
    reaction_after: [question, laughter, reaction_word]
    # Reaktionswörter des Gegenübers oder Transkriptmarken für Lachen, kleingeschrieben.
    reaction_words: [haha, hahaha, hehe, lacht, lachen, gelächter, wow, krass, wahnsinn, unglaublich]
    # Ein Satz ist eine Pointe, wenn innerhalb dieser Sekunden nach seinem Ende gelacht oder reagiert wird.
    punchline_window_s: 1.5
    # Eine Pause an einer Satzgrenze ab dieser Länge ist eine Orientierungspause.
    orientation_min_s: 1.0
    # Gliederungswörter am Anfang des Folgesatzes machen die Pause davor zur Orientierungspause.
    orientation_markers: [erstens, zweitens, drittens, "der nächste punkt", "kommen wir zu", "punkt zwei", "jetzt zum"]
  removal:
    # Füllwörter nur der Klasse hart (äh, ähm); weiche Füllwörter bleiben Vorschlag mit Undo (P3).
    fillers: hard
    # Rückmeldesignale des Gegenübers mitten im Monolog („genau", „okay"); nie eine Antwort auf eine Frage.
    backchannel: true
    # Abgebrochene Ansätze mit Neustart am Satzanfang („Wir haben, wir haben das …").
    restarts: true
    # Begrüßung, Dank und Abschied, nur am Anfang oder Ende des Clips (dazu ausschluss.organisations_marker).
    edge_markers: [
      "danke für die einladung", "für die einladung", "danke erstmal", "danke dass ich da sein darf",
      "schön dass du da bist", "schön dass sie da sind", "herzlich willkommen", "hallo zusammen",
      "grüß gott", "servus", "moin", "guten morgen", "guten tag", "guten abend", "tschüss",
      "bis zum nächsten mal", "auf wiedersehen", "danke fürs zuhören",
    ]
    # Organisatorisches am Rand, zusätzlich zu ausschluss.organisations_marker (nur für das Kürzen).
    organisation_markers: ["bevor wir anfangen", "kurz zur technik", "hört ihr mich", "hörst du mich", "sind wir live", "läuft die aufnahme"]
    # Modalpartikeln werden im Satz nie entfernt (P3, CON-005; eh und fei aus dach_nlp.MODAL_PARTICLES).
    never_remove: [halt, eigentlich, mal, ja, doch, eben, schon, wohl, eh, fei]
  # Nachlauf nach dem Payoff, der gekappt wird; nie eine Einschränkung oder Bedingung.
  reward_end:
    weak_summary: ["also zusammengefasst", "zusammengefasst", "kurz gesagt", "alles in allem", "unterm strich", "wie gesagt"]
    # Nur mit Imperativ oder Anrede in der zweiten Person ein Verkaufsaufruf (trim_plan._is_sales_call).
    sales_call: ["link in der bio", "abonniert den kanal", "abonniere", "folgt mir", "folg mir", "jetzt buchen", "schreibt mir", "schreib mir", "meldet euch", "melde dich", "rabattcode", "kostenloses erstgespräch"]
    farewell: ["tschüss", "ciao", "bis zum nächsten mal", "bis bald", "danke fürs zuhören", "auf wiedersehen", "macht es gut", "machts gut"]
    # Anteil der Inhaltswörter eines Satzes, die schon im Payoff stehen, ab dem er als wiederholte Pointe gilt.
    repeat_overlap: 0.6

# ------------------------------------------------------------------------------------------------
# Suche (neu in Fassung 2, AP5)
# ------------------------------------------------------------------------------------------------
# Vorschläge entstehen vom Payoff rückwärts zum Einstieg und vom Einstieg vorwärts zur Einlösung; weiter
# gehen nur Vorschläge, bei denen beides zusammenpasst (Master-Prompt 7). Gelesen von
# chopstr_worker/pipeline/payoff_search.py (deterministische Suche, auch für den Heuristik-Provider) über
# editorial.search_settings. In story_engine.run wirkt die Suche mit implementation.search.payoff_first
# (Kapitelüberlappung, Episodenübersicht, Seeds, Abgleich, Budget). Rollback: Schalter false.
search:
  # Suche vom Payoff rückwärts zum frühesten Einstieg, der die Einstiegsprüfung besteht.
  payoff_first: true
  # Gegenrichtung: starke Einstiege finden und prüfen, ob das Material einlöst (sonst promise_unfulfilled).
  opening_first: true
  # Einstiege vergleichen (AP6b): story_engine.evaluate_span bewertet bis zu drei substanziell verschiedene
  # Originaleinstiege (payoff_search.alternative_openings, verschiedene Sätze) mit den Gates aus
  # editorial_gates, satz_staerke und der Länge im Fenster, wählt einen und schreibt die anderen mit Grund nach
  # rubric.alternatives_considered. Ein Einstieg, der ein Gate reißt, wird nie gewählt, wenn ein anderer alle
  # besteht. Rollback: false.
  compare_openings: true
  # Überlappung benachbarter Kapitel in Sekunden, damit ein Moment an der Kapitelgrenze nicht zerfällt
  # (segment.chapterize, gelesen von story_engine.run).
  chapter_overlap_s: 30
  # Höchstzahl Modellaufrufe je Stunde Quellmaterial (Übersicht, Vorschlag, Bewertung, Gegenprüfung).
  # Rechnung: Kapitel von 240 s mit 30 s Überlappung ergeben etwa 17 Kapitel je Stunde. Je Kapitel eine
  # Übersicht und ein Vorschlag (2), höchstens vier Kandidaten mit je bis zu vier Bewertungen (erste
  # Bewertung, zwei Reparaturrunden, eine Neubewertung nach dem Heilen des Anfangs) und einer
  # Gegenprüfung einer späteren Einschränkung (je 5, zusammen 20): 22 je Kapitel, 17 mal 22 sind 374.
  # Dazu der Kritiker (AP6b) je Quelle für höchstens output.max_candidates angebotene Kandidaten plus drei
  # Nachrücker aus der Reserve (13): 387; 400 ist die Obergrenze. Aufrufe des Heuristik-Providers zählen
  # mit, werden aber nie verweigert (kein Modell, keine Kosten). Erschöpfung: Kapitel laufen in der Reihenfolge von story_engine.chapter_order
  # (Kapitel mit Seed zuerst); ist das Budget erschöpft, bekommen die übrigen Kapitel keinen Modellaufruf
  # mehr, und der Report nennt sie (budget_exhausted mit den übersprungenen Kapiteln). Durchsetzung im
  # Lauf mit der Verdrahtung in story_engine.run.
  max_llm_calls_per_source_hour: 400
  # Mindestdauer, mit der eine Quelle ins Budget eingeht: so lang wie ein Kapitel (story_engine.CHAPTER_SECONDS).
  # Ein Ausschnitt von 25 Sekunden braucht dieselben Schritte wie ein Kapitel (Übersicht, Vorschlag,
  # Bewertung); ohne diese Untergrenze bekäme er rechnerisch nur zwei Aufrufe.
  budget_min_source_s: 240
  # Woran ein Payoff im Text erkennbar ist (payoff_search.find_payoffs). Kleingeschrieben, als ganze Wörter
  # im kleingeschriebenen Satz. Ergebnis mit Zahl kommt aus moment_typen.zahl, Merksatz zusätzlich aus
  # moment_typen.merksatz; Auflösung nach Frage, Pointe nach Setup und Lachen erkennt der Code aus der
  # Struktur. consequence und explanation brauchen den Satz davor als Kontext. rule, consequence und
  # explanation zählen nur am Satz- oder Teilsatzanfang (nach Komma, Doppelpunkt, „und“, „aber“ oder einem
  # Artikel), lesson und emotional überall; danach muss ein Nomen oder eine Zahl folgen (emotional: ein
  # Satz mit mindestens vier Wörtern).
  payoff_markers:
    rule: ["die regel ist", "faustregel", "das prinzip", "merk dir", "der wichtigste rat", "mein rat ist"]
    consequence: ["deshalb", "deswegen", "darum", "daher", "und dadurch"]
    explanation: ["das heißt", "heißt das", "der grund ist", "der grund war", "der eigentliche grund", "das liegt daran"]
    lesson: ["gelernt", "seitdem", "seither", "die lehre daraus", "im nachhinein", "rückblickend"]
    # Emotionale Auflösung (Master-Prompt 7): der Sprecher ordnet ein, was ein Moment mit ihm gemacht hat.
    emotional: ["heute weiß ich", "das hat mich", "bis heute", "seit diesem tag"]
  # Heckenwörter: ein Satz damit trägt keine Behauptung und ist kein Payoff (Füllgespräch).
  hedge_markers: ["halt", "irgendwie", "ne", "keine ahnung", "ich weiß nicht", "weiß nicht", "oder so"]
  # Wo die Suche endet: Rückweg und Verlängerung gehen nicht über einen Satz mit diesen Markern hinaus,
  # und ein solcher Satz ist weder Payoff noch Einstieg (zusätzlich ausschluss.organisations_marker und
  # an ein Modell gerichtete Sätze, editorial_gates.embedded_instruction und meta_speech).
  stop_markers:
    sponsor: ["werbepause", "sponsor", "gesponsert", "präsentiert von", "rabattcode", "mit dem code", "werbung in eigener sache", "kurze werbung"]
    farewell: ["tschüss", "ciao", "auf wiedersehen", "bis zum nächsten mal", "danke fürs zuhören", "danke für das gespräch", "bis bald"]
    topic_change: ["zurück zum thema", "anderes thema", "nächstes thema", "kommen wir zu", "nächste frage", "themenwechsel"]
  # Marker der Hook-Typen aus Master-Prompt Abschnitt 9 (payoff_search.find_openings). Ein Treffer macht einen
  # Satz zum Einstiegskandidaten (ganze Wörter, kleingeschrieben); ob das Material einlöst, prüft
  # payoff_search.forward_payoff.
  hook_type_markers:
    concrete_contradiction: ["gleichzeitig unser", "in wahrheit", "das gegenteil", "stimmt nicht", "ist falsch"]
    mistake_with_consequence: ["unser fehler", "mein fehler", "größter fehler", "teuerste fehler", "das war ein fehler", "ohne vorher"]
    result_with_open_cause: ["trotzdem gestiegen", "stieg trotzdem", "trotzdem mehr", "obwohl wir weniger"]
    scene_with_stakes: ["damals", "zwei tage vor", "am letzten tag", "kurz vor dem", "mitten in der"]
    decision_rule: ["nur wenn", "nur, wenn", "nur dann", "wir nehmen nur", "der wichtigste rat", "mein rat ist"]
    demonstration: ["hier siehst du", "hier sehen sie", "schau mal hier", "ich zeig dir", "ich zeige ihnen", "ich zeig ihnen"]
    self_correction: ["ich dachte lange", "ich dachte immer", "ich lag falsch", "ich habe mich geirrt", "ich hab mich geirrt"]
    recognizable_problem: ["kennst du das", "kennen sie das", "du bekommst ständig", "das problem ist", "fast niemand"]
    perspective_shift: ["das problem war nicht", "das problem ist nicht", "es geht nicht um", "der punkt ist nicht"]
    punchline: ["stellt sich heraus", "stellte sich heraus", "wie sich herausstellte", "und dann fragt"]

# ------------------------------------------------------------------------------------------------
# Harte Gates (neu in Fassung 2, AP4)
# ------------------------------------------------------------------------------------------------
# Feststellbare Verletzungen der Eigenständigkeit und Originaltreue verwerfen einen Kandidaten vor dem
# Ranking (Master-Prompt 19). Jede Regel ist einzeln schaltbar; die Prüfungen stehen in
# chopstr_worker/pipeline/editorial_gates.py. Zwei Werte mit verschiedener Bedeutung:
#   implementation.gates.discard_hard (Schalter): die Gates laufen in story_engine (Bericht in
#     rubric.quality_gate_results, Heilung vor dem Verwerfen, Marker-Regel v2 in Sinntreue-Tor und
#     Story-Graph, Quote je Gate im DetectReport). false ist der Rollback auf das Verhalten vor AP4.
#   gates.discard_hard (Regel, hier): Verletzer verwerfen (true) oder nur berichten (false, Entscheidung
#     reported, keine Faltung in die fünf Tore). Bis zum Blindvergleich (AP11) false: Berichtsmodus.
# embedded_instruction und meta_speech verwerfen nie: der Kandidat bleibt Inhalt und wird markiert.
gates:
  unresolved_pronoun: true
  back_reference: true
  open_question_unanswered: true
  boundary_negation_condition: true
  reported_speech: true
  forward_reference: true
  speaker_turn: true
  later_correction: true
  embedded_instruction: true
  meta_speech: true
  discard_hard: false

# ------------------------------------------------------------------------------------------------
# Ausgabeumfang (neu in Fassung 2, AP9)
# ------------------------------------------------------------------------------------------------
# max_candidates: höchstens so viele Kandidaten je Quelle bietet story_engine.select_best an (vorher 20 fest im
# Code). Keine feste Clipanzahl pro Stunde, Verwerfen bleibt zulässig (Master-Prompt Abschnitt 7).
# redundancy_jaccard: ab diesem Anteil gemeinsamer Inhaltswörter (Lemma-Jaccard aus story_graph._lemmas) gilt
# ein Kandidat als dieselbe Aussage wie ein schon behaltener und fällt mit Grund redundant, auch ohne zeitliche
# Überdeckung. Wirksam mit implementation.output.max_candidates. Rollback: max_candidates: 20 oder der Schalter
# auf false.
output:
  max_candidates: 10
  redundancy_jaccard: 0.6

# ------------------------------------------------------------------------------------------------
# Getrennte Rollen (neu in Fassung 2, AP6b)
# ------------------------------------------------------------------------------------------------
# Analyst ist episode_overview (AP5), Editor propose_moments_v2 und die Einstiegswahl, Evaluator die
# deterministischen Gates und Teilwerte (kein Modell). critic: der Kritiker (critique_clip_v1,
# chopstr_worker/pipeline/critic.py) prüft nur die Überlebenden von select_best, höchstens so viele wie
# angeboten werden, innerhalb von search.max_llm_calls_per_source_hour. Ein bestätigter Befund der Schwere
# fidelity mit wörtlichem Beleg verwirft (critic:<kind>); andere Befunde stehen in rubric.critic_findings.
# Befunde der Heuristik verwerfen nie (unkalibriert). Wirksam erst mit implementation.roles.critic.
roles:
  critic: true

# ------------------------------------------------------------------------------------------------
# Prompt-Pins (neu in Fassung 2)
# ------------------------------------------------------------------------------------------------
# Welche Datei packages/prompts/<name>_v<N>.md gilt. Eine neue Prompt-Version wird erst wirksam, wenn
# sie hier gepinnt ist; bis ein Arbeitspaket eine neue Datei pinnt, gelten dieselben Versionen wie in
# Fassung 1 (editorial.V1_PROMPT_PINS).
prompts:
  system_editor: 2               # AP4: system_editor_v2 (Transkript, Titel, Metadaten sind Daten; Begrenzer)
  propose_moments: 2          # AP5: propose_moments_v2 (Payoff zuerst, Übersicht, Seeds, Policy im Prompt)
  score_clip: 3               # AP9: score_clip_v3 (sieben Kriterien wie v2 plus editorial_subscores 0 bis 4 mit Beleg, Kandidat als Daten)
  story_graph_confirm: 1
  hooks: 2                    # AP6a: hooks_v2 (verschiedene Originalstellen, Frage als Variante, Clip als Daten)
  post_caption: 1
  episode_overview: 1         # AP5: Übersicht je Kapitel, nur für die Suche
  critique_clip: 1            # AP6b: Kritiker, sucht gezielt Widerlegung, unklares Pronomen, entfernte Bedingung, falschen Übergang, fremde Position

# ------------------------------------------------------------------------------------------------
# Schalter der Arbeitspakete (neu in Fassung 2)
# ------------------------------------------------------------------------------------------------
# Jede Verbesserung lässt sich einzeln messen und abschalten (Plan Abschnitt 4, Master-Prompt 26).
# Alle stehen auf false, bis ihr Paket gebaut ist; der Code liest sie erst mit dem jeweiligen Paket.
# Die Schalter sind Rollback-Mechanik, keine redaktionellen Regeln; die Regeln, die sie freischalten,
# kommen mit ihrem Paket und tragen dann eine Herkunft in origins.
implementation:
  sentence_rule: true         # AP2: eine Satzende-Funktion, Anfang heilen (gebaut, liest segmentation)
  gates:
    discard_hard: true        # AP4: Gates laufen (Bericht, Heilung, Marker v2); verworfen wird erst mit der Regel gates.discard_hard
  search:
    payoff_first: true        # AP5: Suche vom Payoff rückwärts zum Einstieg (gebaut, story_engine.run liest search)
  hook:
    native_spoken: true       # AP6a: gesprochener Einstieg als Originalstelle, Auswahl v2 (gebaut)
  trim:
    enabled: true             # AP7: Remove- und Keep-Logik (gebaut); wirksam erst mit der Regel trim.enabled, die bis zum Blindvergleich false bleibt
  cut:
    padding: true             # AP10b: Vor- und Nachlauf an Wortgrenzen (gebaut, liest Abschnitt cut)
  captions:
    word_bridge: true         # AP10a: Wort-Events bis zum nächsten Wort (gebaut, liest Abschnitt captions)
  output:
    max_candidates: true      # AP9: Obergrenze und Redundanz über Inhalt in select_best (gebaut, liest Abschnitt output)
  # Register der Schlüssel (AP9): Status je Regel aus origins (implemented, partial, not_implemented), Grund
  # bei partial und not_implemented. Die lesende Funktion steht in editorial.IMPLEMENTED_KEYS. Ein Verhalten
  # ohne eigenen Schlüssel: Neubewertung nach der Verlängerung (AP2, story_engine.evaluate_span), siehe
  # editorial.IMPLEMENTED_BEHAVIOURS.
  keys:
    laenge.ziel_s: {status: implemented}
    laenge.gut_von_s: {status: implemented}
    laenge.gut_bis_s: {status: implemented}
    laenge.hart_min_s: {status: implemented}
    laenge.hart_max_s: {status: implemented}
    laenge.kontext_zugabe_s: {status: implemented}

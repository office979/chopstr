# chopstr.io - die Warteseite veröffentlichen.
#
# Läuft nur, wenn sich unter site/ etwas geändert hat, und nur auf main. Damit gilt genau das,
# was verabredet ist: auf einem Zweig arbeiten, auf main zusammenführen, und erst dann ist es
# draussen. Ein Push auf einen Feature-Zweig ändert die Website nicht.
#
# Es wird nichts gebaut. site/ ist reines HTML, CSS und eine Datei JavaScript - was im Repository
# liegt, liegt danach auf dem Server. Ohne Bauschritt kann der Bau auch nicht kaputtgehen.

name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  # Von Hand auslösbar, falls die Seite einmal ohne Änderung neu hinaus soll.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Zwei Läufe gleichzeitig würden sich gegenseitig überholen. Der jüngere gewinnt, aber ein
# laufender wird zu Ende gebracht: sonst steht die Seite kurz gar nicht da.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Ein Impressum mit Lücken ist in Österreich und Deutschland abmahnfähig. Der Lauf bricht
      # deswegen nicht ab - es ist Ferdis Seite und seine Entscheidung, wann sie hinausgeht -
      # aber die Warnung steht unübersehbar in der Zusammenfassung des Laufs.
      - name: Rechtstexte auf offene Lücken prüfen
        run: |
          anzahl=$(grep -c 'class="luecke"' site/impressum.html site/datenschutz.html | awk -F: '{s+=$2} END {print s+0}')
          if [ "$anzahl" -gt 0 ]; then
            {
              echo "### ⚠️ $anzahl offene Stelle(n) in den Rechtstexten"
              echo ""
              echo "Impressum oder Datenschutzerklärung enthalten noch Platzhalter."
              echo "Vor dem Umlegen der Domain chopstr.io ausfüllen."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Ebenso: eine Warteliste ohne Ziel nimmt keine Adresse entgegen.
      - name: Ziel der Warteliste prüfen
        run: |
          if grep -q '^const ENDPUNKT = "";' site/anmeldung.js; then
            {
              echo "### ⚠️ Die Warteliste ist noch nicht scharf geschaltet"
              echo ""
              echo "In site/anmeldung.js fehlt die Web-App-Adresse des Apps Script."
              echo "Siehe site/apps-script/README.md."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Fingerabdruck an die Adressen von CSS und JavaScript hängen.
      #
      # GitHub Pages liefert beides mit "cache-control: max-age=600" aus. Zehn Minuten lang hält
      # ein Browser also die alte Datei fest - und trifft damit auf das NEUE HTML. Wer in diesem
      # Fenster vorbeikommt, sieht eine Seite, deren neue Bausteine keine Gestaltung haben. Genau
      # das ist am 25.09.2026 passiert, als Navigation und Produktbild dazukamen.
      #
      # Mit dem Fingerabdruck zeigt neues HTML auf eine Adresse, die noch nie im Zwischenspeicher
      # war. Der alte Eintrag darf dort ruhig liegen bleiben, er wird nie wieder gefragt.
      #
      # Nur beim Ausliefern, nicht im Repository: lokal soll "styles.css" einfach "styles.css"
      # heissen, und niemand soll eine Zahl von Hand hochzählen müssen.
      - name: CSS und JavaScript mit Fingerabdruck versehen
        run: |
          css=$(sha256sum site/styles.css | cut -c1-10)
          js=$(sha256sum site/anmeldung.js | cut -c1-10)
          sed -i \
            -e "s|href=\"styles.css\"|href=\"styles.css?v=$css\"|g" \
            -e "s|src=\"anmeldung.js\"|src=\"anmeldung.js?v=$js\"|g" \
            site/*.html
          echo "styles.css?v=$css / anmeldung.js?v=$js" >> "$GITHUB_STEP_SUMMARY"
          # Gegenprobe: bleibt irgendwo eine Adresse ohne Fingerabdruck stehen, war das sed falsch.
          if grep -n 'href="styles.css"\|src="anmeldung.js"' site/*.html; then
            echo "Eine Adresse ohne Fingerabdruck ist stehen geblieben." >&2
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: pages
        uses: actions/deploy-pages@v4

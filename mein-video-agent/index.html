<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Einrichtungsprüfung</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0a0a; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden;
              font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      #a-roll { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; }
      #badge { position: absolute; left: 120px; bottom: 140px;
               padding: 28px 44px; background: rgba(10,10,10,0.82);
               border-left: 10px solid #4ade80; border-radius: 6px; }
      #badge h1 { color: #f4f4f5; font-size: 76px; font-weight: 600; letter-spacing: -0.02em; }
      #badge p  { color: #a1a1aa; font-size: 34px; font-weight: 400; margin-top: 10px; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-z7xn" id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">

      <video data-hf-id="hf-rmzl" id="a-roll" class="clip" src="assets/testclip.mp4" data-start="0" data-duration="5" data-track-index="0" muted playsinline></video>

      <audio data-hf-id="hf-s99f" id="a-roll-audio" src="assets/testclip.mp4" data-start="0" data-duration="5" data-track-index="10" data-volume="1"></audio>

      <div data-hf-id="hf-asp0" id="badge" class="clip" data-start="0.4" data-duration="4.6" data-track-index="1">
        <h1 data-hf-id="hf-jm3h" id="badge-title">Einrichtung geprüft</h1>
        <p data-hf-id="hf-5bkz" id="badge-sub">HyperFrames 0.8.77 · lokaler Testclip</p>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      tl.from("#badge", { opacity: 0, x: -60, duration: 0.6, ease: "power3.out" }, 0.4);
      tl.from("#badge-sub", { opacity: 0, duration: 0.5, ease: "power2.out" }, 0.8);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
